[package]
name = "ootle_invoice"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tari_template_lib = "0.38"

[dev-dependencies]
tari_template_test_tooling = "0.50"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
